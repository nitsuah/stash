<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Google Business Profile checklist</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#111;background:#fff}ul{list-style:none;padding:0}li{margin:.4rem 0}</style></head><body><main><h1>Google Business Profile checklist</h1><p>Ticks are saved in this browser.</p><h2>Basics</h2><ul><li><label><input type='checkbox' data-k='Basics-0'> Claim and verify the profile</label></li><li><label><input type='checkbox' data-k='Basics-1'> Exact business name (no keyword stuffing)</label></li><li><label><input type='checkbox' data-k='Basics-2'> Primary category plus 2-3 secondary categories</label></li><li><label><input type='checkbox' data-k='Basics-3'> Phone number and website link</label></li><li><label><input type='checkbox' data-k='Basics-4'> Service area or address set correctly</label></li></ul><h2>Details</h2><ul><li><label><input type='checkbox' data-k='Details-0'> Opening hours, including holiday hours</label></li><li><label><input type='checkbox' data-k='Details-1'> Business description (750 characters, plain and specific)</label></li><li><label><input type='checkbox' data-k='Details-2'> Attributes (wheelchair access, outdoor seating, etc.)</label></li><li><label><input type='checkbox' data-k='Details-3'> Products or services list with prices</label></li></ul><h2>Photos</h2><ul><li><label><input type='checkbox' data-k='Photos-0'> Logo and cover photo</label></li><li><label><input type='checkbox' data-k='Photos-1'> 10+ real photos: storefront, inside, team, work</label></li><li><label><input type='checkbox' data-k='Photos-2'> Replace outdated photos each season</label></li></ul><h2>Reviews</h2><ul><li><label><input type='checkbox' data-k='Reviews-0'> Link to ask for reviews</label></li><li><label><input type='checkbox' data-k='Reviews-1'> Reply to every review, good and bad</label></li><li><label><input type='checkbox' data-k='Reviews-2'> Never buy or fake reviews</label></li></ul><h2>Ongoing</h2><ul><li><label><input type='checkbox' data-k='Ongoing-0'> Post an update or offer monthly</label></li><li><label><input type='checkbox' data-k='Ongoing-1'> Check questions and answers</label></li><li><label><input type='checkbox' data-k='Ongoing-2'> Review insights quarterly</label></li></ul></main><script>document.querySelectorAll('input[type=checkbox]').forEach(function(c){try{c.checked=localStorage.getItem(c.dataset.k)==='1'}catch(e){}c.addEventListener('change',function(){try{localStorage.setItem(c.dataset.k,c.checked?'1':'0')}catch(e){}})})</script></body></html>
