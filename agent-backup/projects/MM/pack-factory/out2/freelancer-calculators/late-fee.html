<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Late fee calculator</title><style>body{font:18px/1.5 system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#111;background:#fff}label{display:block;margin:.8rem 0 .2rem;font-weight:600}input{font:inherit;padding:.4rem;width:100%;box-sizing:border-box}output{display:block;margin-top:1.2rem;padding:1rem;background:#eef2ff;border-radius:6px;font-size:1.3rem}h1{font-size:1.5rem}</style></head><body><main><h1>Late fee calculator</h1><label for='amount'>Invoice amount ($)</label><input id='amount' type='number' step='any' value='1000'><label for='rate'>Monthly late fee (%)</label><input id='rate' type='number' step='any' value='1.5'><label for='months'>Months late</label><input id='months' type='number' step='any' value='2'><output id='out' aria-live='polite'></output><p>Simple (non-compounding) fee. Check your contract and local rules before charging fees.</p></main><script>const $=i=>parseFloat(document.getElementById(i).value)||0;function run(){const f=$('amount')*($('rate')/100)*$('months');document.getElementById('out').textContent='Late fee: $'+f.toFixed(2)+'   Total due: $'+($('amount')+f).toFixed(2);}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',run));run();</script></body></html>
