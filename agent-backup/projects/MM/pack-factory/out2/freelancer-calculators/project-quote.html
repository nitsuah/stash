<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Project quote with buffer</title><style>body{font:18px/1.5 system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#111;background:#fff}label{display:block;margin:.8rem 0 .2rem;font-weight:600}input{font:inherit;padding:.4rem;width:100%;box-sizing:border-box}output{display:block;margin-top:1.2rem;padding:1rem;background:#eef2ff;border-radius:6px;font-size:1.3rem}h1{font-size:1.5rem}</style></head><body><main><h1>Project quote with buffer</h1><label for='hours'>Estimated hours</label><input id='hours' type='number' step='any' value='40'><label for='rate'>Hourly rate ($)</label><input id='rate' type='number' step='any' value='75'><label for='buffer'>Risk buffer (%)</label><input id='buffer' type='number' step='any' value='20'><label for='costs'>Fixed costs ($)</label><input id='costs' type='number' step='any' value='0'><output id='out' aria-live='polite'></output><p>Quote = hours x rate x (1 + buffer) + costs.</p></main><script>const $=i=>parseFloat(document.getElementById(i).value)||0;function run(){const q=$('hours')*$('rate')*(1+$('buffer')/100)+$('costs');document.getElementById('out').textContent='Quote: $'+q.toFixed(2);}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',run));run();</script></body></html>
