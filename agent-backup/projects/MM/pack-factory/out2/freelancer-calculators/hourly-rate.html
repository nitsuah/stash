<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Hourly rate calculator</title><style>body{font:18px/1.5 system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#111;background:#fff}label{display:block;margin:.8rem 0 .2rem;font-weight:600}input{font:inherit;padding:.4rem;width:100%;box-sizing:border-box}output{display:block;margin-top:1.2rem;padding:1rem;background:#eef2ff;border-radius:6px;font-size:1.3rem}h1{font-size:1.5rem}</style></head><body><main><h1>Hourly rate calculator</h1><label for='income'>Target yearly income ($)</label><input id='income' type='number' step='any' value='80000'><label for='expenses'>Yearly business expenses ($)</label><input id='expenses' type='number' step='any' value='12000'><label for='hours'>Billable hours per week</label><input id='hours' type='number' step='any' value='25'><label for='weeks'>Working weeks per year</label><input id='weeks' type='number' step='any' value='46'><output id='out' aria-live='polite'></output><p>Before taxes. Adjust for your own situation.</p></main><script>const $=i=>parseFloat(document.getElementById(i).value)||0;function run(){const r=($('income')+$('expenses'))/Math.max(1,$('hours')*$('weeks'));document.getElementById('out').textContent='Minimum hourly rate: $'+r.toFixed(2);}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',run));run();</script></body></html>
