<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Margin and markup</title><style>body{font:18px/1.5 system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#111;background:#fff}label{display:block;margin:.8rem 0 .2rem;font-weight:600}input{font:inherit;padding:.4rem;width:100%;box-sizing:border-box}output{display:block;margin-top:1.2rem;padding:1rem;background:#eef2ff;border-radius:6px;font-size:1.3rem}h1{font-size:1.5rem}</style></head><body><main><h1>Margin and markup</h1><label for='cost'>Cost ($)</label><input id='cost' type='number' step='any' value='60'><label for='price'>Price ($)</label><input id='price' type='number' step='any' value='100'><output id='out' aria-live='polite'></output><p>Margin is profit as a share of price; markup is profit as a share of cost.</p></main><script>const $=i=>parseFloat(document.getElementById(i).value)||0;function run(){const m=$('price')?($('price')-$('cost'))/$('price')*100:0;const k=$('cost')?($('price')-$('cost'))/$('cost')*100:0;document.getElementById('out').textContent='Margin: '+m.toFixed(1)+'%   Markup: '+k.toFixed(1)+'%';}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',run));run();</script></body></html>
