<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Accessibility checklist (WCAG 2.2 AA)</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fff}ul{list-style:none;padding:0}li{margin:.5rem 0}input{width:1.2rem;height:1.2rem}</style></head><body><main><h1>Accessibility checklist (WCAG 2.2 AA)</h1><p>A plain-language working checklist. Ticks are saved in this browser. Automated tools catch only part of these; test with a keyboard and a screen reader too.</p><h2>Perceivable</h2><ul><li><label><input type='checkbox' data-k='1.1.1'> <strong>1.1.1</strong> Every meaningful image has a text alternative; decorative images are hidden from assistive tech</label></li><li><label><input type='checkbox' data-k='1.2.2'> <strong>1.2.2</strong> Prerecorded video has captions</label></li><li><label><input type='checkbox' data-k='1.3.1'> <strong>1.3.1</strong> Headings, lists, tables and form labels use real HTML structure</label></li><li><label><input type='checkbox' data-k='1.4.3'> <strong>1.4.3</strong> Text contrast is at least 4.5:1 (3:1 for large text)</label></li><li><label><input type='checkbox' data-k='1.4.4'> <strong>1.4.4</strong> Text can be zoomed to 200% without losing content</label></li><li><label><input type='checkbox' data-k='1.4.10'> <strong>1.4.10</strong> Content reflows at 320px wide without horizontal scrolling</label></li><li><label><input type='checkbox' data-k='1.4.11'> <strong>1.4.11</strong> Buttons, inputs and focus indicators have 3:1 contrast</label></li></ul><h2>Operable</h2><ul><li><label><input type='checkbox' data-k='2.1.1'> <strong>2.1.1</strong> Everything works with a keyboard alone</label></li><li><label><input type='checkbox' data-k='2.1.2'> <strong>2.1.2</strong> Keyboard focus is never trapped</label></li><li><label><input type='checkbox' data-k='2.4.1'> <strong>2.4.1</strong> A skip link lets keyboard users bypass the navigation</label></li><li><label><input type='checkbox' data-k='2.4.3'> <strong>2.4.3</strong> Focus order follows the visual order</label></li><li><label><input type='checkbox' data-k='2.4.4'> <strong>2.4.4</strong> Link text makes sense out of context</label></li><li><label><input type='checkbox' data-k='2.4.7'> <strong>2.4.7</strong> Keyboard focus is clearly visible</label></li><li><label><input type='checkbox' data-k='2.4.11'> <strong>2.4.11</strong> Focused items are not hidden behind sticky headers (WCAG 2.2)</label></li><li><label><input type='checkbox' data-k='2.5.8'> <strong>2.5.8</strong> Click targets are at least 24 by 24 CSS pixels (WCAG 2.2)</label></li></ul><h2>Understandable</h2><ul><li><label><input type='checkbox' data-k='3.1.1'> <strong>3.1.1</strong> The page language is set (html lang)</label></li><li><label><input type='checkbox' data-k='3.2.3'> <strong>3.2.3</strong> Navigation is consistent across pages</label></li><li><label><input type='checkbox' data-k='3.3.1'> <strong>3.3.1</strong> Form errors are identified in text</label></li><li><label><input type='checkbox' data-k='3.3.2'> <strong>3.3.2</strong> Inputs have visible labels and instructions</label></li><li><label><input type='checkbox' data-k='3.3.7'> <strong>3.3.7</strong> Do not ask users to re-enter information you already have (WCAG 2.2)</label></li><li><label><input type='checkbox' data-k='3.3.8'> <strong>3.3.8</strong> Login does not rely on solving a puzzle or memorizing (WCAG 2.2)</label></li></ul><h2>Robust</h2><ul><li><label><input type='checkbox' data-k='4.1.2'> <strong>4.1.2</strong> Custom controls expose name, role and state</label></li><li><label><input type='checkbox' data-k='4.1.3'> <strong>4.1.3</strong> Status messages are announced without moving focus</label></li></ul></main><script>document.querySelectorAll('input[type=checkbox]').forEach(function(c){try{c.checked=localStorage.getItem('a11y-'+c.dataset.k)==='1'}catch(e){}c.addEventListener('change',function(){try{localStorage.setItem('a11y-'+c.dataset.k,c.checked?'1':'0')}catch(e){}})})</script></body></html>
