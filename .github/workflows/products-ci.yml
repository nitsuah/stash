name: Products CI

# Validates the small shippable products in projects/products. Runs only when they change.
# Publishing is deliberately not wired up yet: it needs store secrets and a one-time manual store upload.
on:
  pull_request:
    paths:
      - "projects/products/**"
      - ".github/workflows/products-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/products/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Validate release configs, manifests and schemas
        run: node projects/products/scripts/validate.mjs

      - name: Run product unit tests
        run: |
          # Packages that ship tests (for example the tech-stack fingerprint checks) run here, so data changes cannot skip them.
          files=$(ls projects/products/*/test/*.test.mjs 2>/dev/null || true)
          if [ -n "$files" ]; then node --test $files; else echo "no product unit tests"; fi



      - name: Dry-run package the extension
        working-directory: projects/products/a11y-check-extension
        run: |
          # Zip exactly what release.json declares, so a file added there but missing from the package fails here.
          node -e 'console.log(JSON.parse(require("fs").readFileSync("release.json","utf8")).packageFiles.join("\n"))' > /tmp/package-files.txt
          zip -q ../../../a11y-check-extension.zip -@ < /tmp/package-files.txt
          unzip -t ../../../a11y-check-extension.zip
          unzip -p ../../../a11y-check-extension.zip manifest.json | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(m.name,m.version)'
