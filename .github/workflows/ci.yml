name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-install:
    name: Install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/express

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the gitleaks step can scan exactly the new commits

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/express/package.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check app.js

      # stash is PUBLIC and cloud routines auto-merge their reports once this
      # job passes, so the PII/credential scan lives here to block that merge.
      - name: PII / credential scan (public reports)
        working-directory: .
        run: bash agent/scripts/pii-scan.sh

      # Vault graph health. Links are regenerated in the CI workspace first (not committed:
      # the daily routine commits them), so a PR that only adds a report passes, while one
      # that adds a note no naming rule can place, a duplicate note name, or a broken
      # [[link]] outside the repo mirrors fails. See agent/README.md, Vault Linking Conventions.
      - name: Vault graph check
        working-directory: agent
        run: |
          python3 scripts/build-vault-indexes.py > /dev/null
          python3 scripts/find-orphans.py --check

      # Secret scan of only the commits this PR or push adds, with the triaged
      # allowlist in .gitleaks.toml. The full history was scanned clean on
      # 2026-09-24 (48 findings, all triaged non-secrets).
      - name: Secret scan (gitleaks)
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="$BASE..HEAD"
          fi
          echo "Scanning commits: $range"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --log-opts="$range" --redact --no-banner -v

  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python files
        run: ruff check .

  lint-powershell:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        run: pwsh -Command "Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser"

      - name: Lint PowerShell files
        run: |
          pwsh -Command "
            \$ErrorActionPreference = 'Stop'
            \$files = Get-ChildItem -Recurse -Filter '*.ps1' -File | Where-Object { \$_.FullName -notmatch '/\.git/' }
            if (\$files.Count -eq 0) { Write-Host 'No .ps1 files found'; exit 0 }
            \$results = @()
            foreach (\$file in \$files) {
              \$fileResults = Invoke-ScriptAnalyzer -Path \$file.FullName -Severity Error
              \$results += \$fileResults
            }
            if (\$results.Count -gt 0) {
              \$results | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
            }
            Write-Host 'All PowerShell files pass PSScriptAnalyzer at Error severity'
          "

  test-python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest responses requests

      - name: Run pytest
        run: python -m pytest atlassian/jira/test_examples.py agent/scripts/test_enrich_mirror.py -v