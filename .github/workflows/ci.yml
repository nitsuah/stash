name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-install:
    name: Install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/express

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/express/package.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check app.js
