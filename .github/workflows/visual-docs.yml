name: Visual docs

# Vigil visual-docs recipe (https://github.com/nitsuah/vigil/blob/main/docs/VISUAL_DOCS.md),
# adapted for a repo with no UI: the "screenshot" is the generated vault graph.
# Regenerates docs/screenshots/vault-graph.{png,webp,gif,json} with
# agent/scripts/vault-graph-gif.js (seeded layout, no labels drawn, so no note
# titles appear), renders docs/diagrams/*.mmd to .svg, rewrites the README's
# <!-- visual-docs:start --> block and opens/updates a PR on bot/visual-docs.
# Never pushes to main. pages.yml copies docs/screenshots/vault-graph.* into
# the Pages artifact at deploy time, so the images are committed once.
#
# One-time repo setting: Settings -> Actions -> General -> "Allow GitHub
# Actions to create and approve pull requests".

on:
  push:
    branches: [main]
    # Sources only. Daily notes and reports are left out on purpose, so routine
    # note PRs don't each trigger a render; the weekly cron picks up their growth.
    paths:
      - 'agent/prompts/**'
      - 'agent/routines/**'
      - 'agent/projects/**'
      - 'agent/topics/**'
      - 'agent/scripts/vault-graph-gif.js'
      - 'docs/diagrams/**/*.mmd'
      - 'docs/diagrams/mermaid.config.json'
      - 'scripts/visual-docs-readme.mjs'
      - '.github/workflows/visual-docs.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Render vault graph
        # Same steps as agent/scripts/vault-graph-gif.ps1, minus Docker: ubuntu-latest
        # has ffmpeg. The layout uses a seeded PRNG, so the same vault gives the same image.
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          mkdir -p docs/screenshots "$RUNNER_TEMP/graph"
          cp agent/scripts/vault-graph-gif.js "$RUNNER_TEMP/graph/"
          (cd "$RUNNER_TEMP/graph" && npm i --silent --no-audit --no-fund d3-force@3 pureimage@0.4)
          (cd "$RUNNER_TEMP/graph" && VAULT="$GITHUB_WORKSPACE/agent" OUT_DIR="$GITHUB_WORKSPACE/docs/screenshots" node vault-graph-gif.js)

      - name: Render diagrams
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          PUPPETEER=""
          if [ -n "$CHROME" ]; then
            printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
            PUPPETEER="-p $RUNNER_TEMP/puppeteer.json"
          fi
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 $PUPPETEER -c docs/diagrams/mermaid.config.json -b white -i "$f" -o "${f%.mmd}.svg"
          done

      - name: Update README block
        run: node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            docs/screenshots/vault-graph.*
            README.md
          commit-message: 'docs: regenerate vault graph and diagrams'
          title: 'docs: regenerate vault graph and diagrams'
          body: |
            Regenerated by `.github/workflows/visual-docs.yml` after ${{ github.sha }}.
            Review the images, then merge. No code changes.
