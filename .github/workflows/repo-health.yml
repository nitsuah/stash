name: Repo health

# Weekly advisories, LOC hotspots and root hygiene from the shared kit (nitsuah/.github repo-health/). No model.
on:
  schedule:
    - cron: "0 15 * * 4" # Thu 15:00 UTC (old week-vuln slot)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    uses: nitsuah/.github/.github/workflows/repo-health.yml@main
    permissions:
      contents: read
      issues: write
