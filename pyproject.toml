[tool.ruff]
target-version = "py310"
line-length = 100

# Exclude certain directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]

# Ignore rules that are too invasive for this codebase
ignore = [
    "BLE001",  # Do not catch blind exception - too many try/except Exception
    "S110",    # try-except-pass - intentional in some cases
    "DTZ005",  # datetime.now() without tz - intentional for simple scripts
    "DTZ007",  # Naive datetime - intentional
    "DTZ011",  # date.today() - intentional
    "B023",    # Function definition does not bind loop variable - intentional
    "PLW1510", # subprocess.run without check - intentional for some cases
    "PLW1508", # Invalid type for env var default - intentional
    "SIM115",  # Use context manager - intentional
    "SIM117",  # Use single with - intentional
    "FURB167", # Use regex alias - intentional
    "T201",    # print statements - intentional in example scripts
    "UP017",   # Use datetime.UTC alias - intentional
    "E501",    # Line too long - allow longer lines
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "backend", "database", "SAAS", "sso", "projects"]
